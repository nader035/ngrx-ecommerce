<div class="" appViewPanel>
  <div class="flex items-center gap-4 text-2xl font-bold mb-4">
    <mat-icon>local_shipping</mat-icon>
    Shipping Information
  </div>
  <form>
    <div class="flex items-center gap-4 max-sm:flex-col mb-4">
      <mat-form-field class="flex-1">
        <input type="text" matInput placeholder="First Name" />
      </mat-form-field>
      <mat-form-field class="flex-1">
        <input type="text" matInput placeholder="Last Name" />
      </mat-form-field>
    </div>
    <mat-form-field class="mb-4">
      <textarea matInput name="" id="" placeholder="Address"></textarea>
    </mat-form-field>
    <div class="flex items-center gap-4 max-sm:flex-col mb-4">
      <mat-form-field class="flex-3">
        <input type="text" matInput placeholder="City" />
      </mat-form-field>
      <mat-form-field class="flex-1">
        <input type="text" matInput placeholder="State" />
      </mat-form-field>
    </div>
    <mat-form-field class="mb-4">
      <input matInput type="text" placeholder="Zip Code" />
    </mat-form-field>
  </form>
</div>
