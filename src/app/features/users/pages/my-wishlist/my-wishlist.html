<div class="mx-auto max-w-[1200px] py-6 px-4">
  <app-back-button navigateTo="/users/products/all" class="mb-6">Continue Shopping</app-back-button>
  @if (store.wishlistCount()>0) {
  <div class="flex justify-between items-center mb-4">
    <h1 class="font-bold text-2xl">My Wishlist</h1>
    <span class="text-gray-500 text-xl">{{ store.wishlistCount() }} Items</span>
  </div>
  <div class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
    @for (product of store.wishlistItems(); track $index) {
    <app-product-card [product]="product">
      <button
        class="!absolute top-3 right-3 z-10 w-10 h-10 flex items-center justify-center !bg-white transition-all duration-300 border-0 shadow-md hover:shadow-lg hover:scale-110"
        matIconButton
        (click)="removeFromWishlist(product)"
      >
        <mat-icon>delete</mat-icon>
      </button>
    </app-product-card>
    }
  </div>
  <div class="mt-8 flex justify-center">
    <button matButton="outlined" class="danger" (click)="store.clearWishlist()">
      Clear Wishlist
    </button>
  </div>
  }@else {
  <div class="flex flex-col items-center py-16">
    <div class="w-20 h-20 flex items-center justify-center bg-gray-100 rounded-full mb-6">
      <mat-icon class="scale-150">favorite_border</mat-icon>
    </div>
    <h1 class="text-2xl font-bold">Your wishlist is empty</h1>
    <p class="text-sm text-gray-400">Save items you love for later!</p>
    <button matButton="filled" routerLink="/users/products/all" class="mt-6">Start Shopping</button>
  </div>
  }
</div>
