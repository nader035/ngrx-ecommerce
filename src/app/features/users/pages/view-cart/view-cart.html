<div class="max-w-[1200px] mx-auto py-6 px-4">
  <app-back-button navigateTo="/users/products/all" class="mb-6">Continue Shopping</app-back-button>
  <h1 class="text-3xl font-bold mb-4">Shopping Cart</h1>
  <div class="flex items-center justify-between max-sm:flex-col max-sm:gap-4 mb-6" appViewPanel>
    <div class="flex items-center gap-4 max-sm:flex-col">
      <mat-icon class="!text-red-600">favorite_border</mat-icon>
      <div>
        <h2 class="text-xl font-bold">Wishlist ({{ store.wishlistCount() }} items)</h2>
        <p class="text-sm text-gray-400">
          You have {{ store.wishlistCount() }} item saved for later
        </p>
      </div>
    </div>
    <div class="actions flex items-center gap-3">
      <button matButton routerLink="/users/wishlist">view All</button>
      <button
        matButton="filled"
        class="flex items-center justify-center gap-2"
        (click)="store.addAllWishlistToCart()"
      >
        <mat-icon>shopping_cart</mat-icon>
        <span class="max-sm:hidden"> Add all to the cart </span>
      </button>
    </div>
  </div>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2">
      <app-list-cart-items></app-list-cart-items>
    </div>
    <div>
      <app-summerize-order>
        <button actionButton matButton="filled" class="w-full" (click)="store.proceedToCheckout()">
          Proceed to checkout
        </button>
      </app-summerize-order>
    </div>
  </div>
</div>
