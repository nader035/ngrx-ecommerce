<div class="" appViewPanel>
  <h1 class="text-2xl font-bold mb-8">Order Summary</h1>
  <div class="space-y-2 pb-4">
    <ng-content select="[checkoutItems]"></ng-content>
  </div>
  <div class="">
    <div class="space w-full h-[1px] bg-black"></div>
    <div class="py-4 flex flex-col gap-3 text-lg">
      <div class="sub-total flex items-center justify-between">
        <span>Subtotal</span>
        <span>{{ subtotal() | currency : 'USD' }}</span>
      </div>
      <div class="tax flex items-center justify-between">
        <span>Tax</span> <span>{{ tax() | currency : 'USD' }}</span>
      </div>
    </div>
    <div class="space w-full h-[1px] bg-black"></div>
    <div class="total mt-4 mb-6 flex items-center justify-between text-xl font-bold">
      <span>Total</span> <span>{{ total() | currency : 'USD' }}</span>
    </div>
  </div>
  <ng-content
    select="[actionButton]"
  ></ng-content>
</div>
