<div class="flex bg-gray-50 rounded-lg items-center gap-6 mb-6 p-4 max-md:flex-col">
  <div class="flex-1 flex flex-col items-center justify-center">
    <h1 class="text-4xl font-extrabold">
      {{ product().rating }}
    </h1>
    <app-star-rating [rating]="product().rating"></app-star-rating>
    <p>Based on {{ totalReviews() }} reviews</p>
  </div>
  <div class="flex-1 flex flex-col items-center justify-center gap-2 w-full">
    @for (breakdown of ratingBreakdown(); track $index) {
    <div class="flex w-full items-center gap-3">
      <div class="flex items-center">
        {{ breakdown.star }}
        <mat-icon class="!text-sm -mb-1">star</mat-icon>
      </div>
      <div class="flex-1 bg-gray-200 rounded-full h-2">
        <div
          class="bg-yellow-300 h-full rounded-full transition-all duration-300"
          [style.width.%]="breakdown.percentage"
        ></div>
      </div>
      <span>{{ breakdown.count }}</span>
    </div>
    }
  </div>
</div>
