<div appViewPanel class="mb-4 flex gap-3">
  <img
    [src]="review().userImageUrl"
    [alt]="review().userName"
    class="w-[50px] h-[50px] rounded-full"
  />
  <div class="">
    <h1 class="font-semibold text-lg">{{ review().userName }}</h1>
    <div class="flex items-center">
      <app-star-rating [rating]="review().rating" />
      <div class="text-sm text-gray-500">{{ review().reviewDate | date : 'MMM d, yyyy' }}</div>
    </div>
    <h3 class="font-semibold text-lg mb-2">{{ review().title }}</h3>
    <p class="text-gray-500">{{ review().comment }}</p>
  </div>
</div>
