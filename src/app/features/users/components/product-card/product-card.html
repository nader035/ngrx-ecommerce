<div
  class="product-card bg-white rounded-xl shadow-lg overflow-hidden flex flex-col cursor-pointer h-full relative transition-all ease-out duration-200 hover:-translate-y-1 hover:shadow-xl"
  [routerLink]="['/users', 'product', product().id]"
>
  <img
    [src]="product().imageUrl"
    [alt]="product().name"
    class="w-full h-[300px] object-cover rounded-t-xl"
    [style.view-transition-name]="'product-image-' + product().id"
  />

  <ng-content></ng-content>
  <div class="product-content p-5 flex flex-col flex-1">
    <h3 class="text-lg font-semibold leading-tight text-gray-900 mb-2">
      {{ product().name }}
    </h3>
    <p class="text-sm text-gray-600 mb-4 flex-1 leading-relaxed">{{ product().description }}</p>
    <app-star-rating [rating]="product().rating"> ({{ product().reviewCount }}) </app-star-rating>
    <div
      class="text-sm font-medium mb-4"
      [class]="product().inStock ? 'text-green-600' : 'text-red-600'"
    >
      {{ product().inStock ? 'In Stock' : 'Out of Stock' }}
    </div>
    <div class="flex items-center justify-between mt-auto">
      <span class="text-2xl font-bold text-gray-900">
        {{ product().price | currency : 'USD' }}
      </span>
      <button
        matButton="filled"
        class="flex items-center gap-2"
        (click)="store.addToCart(product())"
        (click)="$event.stopPropagation()"
      >
        <mat-icon>shopping_cart</mat-icon>
        Add to cart
      </button>
    </div>
  </div>
</div>
